name: Build custom Touch Portal bundle

on:
  workflow_dispatch:
    inputs:
      pages:
        description: JSON array of selected page names
        required: true
        type: string
      bundle_id:
        description: Unique identifier for this bundle request
        required: true
        type: string

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build bundle
        id: build
        env:
          SELECTED_PAGES_JSON: ${{ inputs.pages }}
          BUNDLE_ID: ${{ inputs.bundle_id }}
        run: python bundle_pages_v2.py

      - name: Publish request-specific download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: gbe-bundle-${{ inputs.bundle_id }}
          name: GBE Deck bundle ${{ inputs.bundle_id }}
          files: ${{ steps.build.outputs.bundle_file }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
